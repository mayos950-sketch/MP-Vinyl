*{box-sizing:border-box}
:root{--gold:#e7bb68;--gold2:#f5d28d;--bg:#0a0807;--panel:#15110e;--text:#f8f1e7;--muted:#b9aea3;--line:rgba(231,187,104,.25)}
html,body{margin:0;min-height:100%;background:#090706;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.screen{display:none;min-height:100vh;padding-bottom:92px}
.screen.active{display:block}
.home-wrap{max-width:900px;margin:auto;padding:calc(16px + env(safe-area-inset-top)) 16px 105px}
.home-top{display:flex;justify-content:space-between;gap:10px;align-items:center}
.pill{border:1.5px solid var(--gold);background:#15100ccb;color:#fff;border-radius:999px;padding:10px 14px;font-weight:800;min-height:44px}
.lang-select{appearance:none;padding-right:32px;background-image:linear-gradient(45deg,transparent 50%,var(--gold) 50%),linear-gradient(135deg,var(--gold) 50%,transparent 50%);background-position:calc(100% - 17px) 18px,calc(100% - 12px) 18px;background-size:5px 5px,5px 5px;background-repeat:no-repeat}
.brand{text-align:center;margin:18px 0 16px}
.brand h1{margin:0;font-family:Georgia,serif;font-size:clamp(3rem,11vw,5.5rem);font-weight:500;letter-spacing:-.05em}
.brand h1 .mp{color:var(--gold)}
.brand p{margin:6px 0 0;letter-spacing:.13em;color:#eee5da}
.home-search{width:100%;padding:15px 17px;border-radius:18px;border:1px solid #ffffff33;background:#24201dcc;color:#fff;font-size:1rem;backdrop-filter:blur(10px)}

.hero-actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:-18px;position:relative;z-index:2}
.hero-btn{min-height:64px;border:1.5px solid var(--gold);border-radius:999px;background:#1b110bdc;color:#fff6e7;font-weight:900;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 10px 28px #0006}
.hero-btn .ico{font-size:1.5rem;color:var(--gold2)}
.section-head{display:flex;justify-content:space-between;align-items:center;margin:24px 0 12px}
.section-head h3{margin:0}
.recent{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.recent .mini{background:#15110e;border:1px solid #ffffff0f;border-radius:14px;overflow:hidden}
.recent .mini .c{aspect-ratio:1;background:radial-gradient(circle,#caa45f 0 9%,#0b0b0b 10% 100%)}
.recent .mini .m{padding:8px;font-size:.82rem}

.topbar{padding:calc(18px + env(safe-area-inset-top)) 16px 12px;display:flex;gap:12px;align-items:center}
.topbar h2{margin:0;font-size:1.8rem}
.back{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:#16120f;color:var(--gold);font-size:1.8rem}
.content{padding:0 16px 110px;max-width:900px;margin:auto}
.card{background:linear-gradient(180deg,#17130f,#100d0b);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:14px}
.searchbox{width:100%;padding:15px 16px;border-radius:16px;border:1px solid var(--line);background:#181411;color:#fff}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.record{background:#15110e;border:1px solid #ffffff10;border-radius:16px;overflow:hidden}
.cover{aspect-ratio:1;background:radial-gradient(circle,#caa45f 0 9%,#0b0b0b 10% 100%);display:grid;place-items:center;overflow:hidden}
.cover img{width:100%;height:100%;object-fit:cover}
.record .meta{padding:11px}
.record .meta b{display:block}
.record .meta small{color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.stat{background:#15110e;border:1px solid var(--line);border-radius:18px;padding:18px;text-align:center}
.stat b{display:block;font-size:2rem;color:var(--gold)}
.stat span{color:var(--muted);font-size:.85rem}
.profile-actions{display:grid;gap:10px}
.profile-actions button,.profile-actions select{padding:15px 16px;border-radius:14px;border:1px solid var(--line);background:#17130f;color:#fff;text-align:left;font-weight:700}
.bottom{position:fixed;left:0;right:0;bottom:0;height:82px;z-index:50;padding:7px 8px calc(7px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(5,1fr);background:rgba(10,8,7,.94);border-top:1px solid #ffffff12;backdrop-filter:blur(20px)}
.nav{border:0;background:transparent;color:#b4aaa0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:.72rem;font-weight:700}
.nav.active{color:var(--gold)}
.nav .nicon{font-size:1.35rem}
.nav.plus .nicon{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(#f0c875,#ca9542);color:#111;font-size:2rem}
dialog{border:1px solid #3a332b;background:#111318;color:#fff;border-radius:22px;width:min(92vw,520px);padding:0}
dialog::backdrop{background:rgba(0,0,0,.72);backdrop-filter:blur(4px)}
.modal{padding:22px}
.modal-head{display:flex;justify-content:space-between;align-items:center}
.modal-head h3{margin:0;font-size:1.6rem}
.close{border:0;background:transparent;color:#fff;font-size:1.8rem}
.field{margin-top:12px}
.field label{display:block;color:#c7c0b8;font-size:.85rem;margin-bottom:6px}
.field input,.field textarea{width:100%;padding:13px 14px;border-radius:13px;border:1px solid #3b3f46;background:#181b20;color:#fff}
.primary{width:100%;margin-top:14px;padding:14px;border:0;border-radius:999px;background:linear-gradient(#f0cb7f,#d8a34d);color:#18120a;font-weight:900}
.secondary{width:100%;margin-top:10px;padding:13px;border-radius:999px;border:1px solid #5a5044;background:#191613;color:#fff;font-weight:800}
.small{font-size:.86rem;color:var(--muted)}
.row{display:flex;gap:10px} .row>*{flex:1}
@media(max-width:600px){.brand h1{font-size:3.4rem}.brand p{font-size:.88rem}.hero-btn{font-size:.9rem;min-height:58px}.recent{grid-template-columns:repeat(3,1fr)}}
</style>
</head>

<section id="search" class="screen"><div class="topbar"><button class="back" data-go="home">‹</button><h2 id="searchTitle">Suche</h2></div><div class="content"><input id="searchInput" class="searchbox"><div id="searchGrid" class="grid" style="margin-top:14px"></div></div></section>
<section id="stats" class="screen"><div class="topbar"><button class="back" data-go="home">‹</button><h2 id="statsTitle">Statistik</h2></div><div class="content"><div class="stats"><div class="stat"><b id="sRecords">0</b><span id="lblRecords">Platten</span></div><div class="stat"><b id="sArtists">0</b><span id="lblArtists">Interpreten</span></div><div class="stat"><b id="sGenres">0</b><span id="lblGenres">Genres</span></div><div class="stat"><b id="sYears">0</b><span id="lblYears">Jahrgänge</span></div></div><div class="card"><b id="topArtistLabel">Meistgesammelter Interpret</b><div id="topArtist" style="margin-top:8px;color:var(--gold)">–</div></div><div class="card"><b id="topGenreLabel">Häufigstes Genre</b><div id="topGenre" style="margin-top:8px;color:var(--gold)">–</div></div></div></section>
<section id="profile" class="screen"><div class="topbar"><button class="back" data-go="home">‹</button><h2 id="profileTitle">Profil</h2></div><div class="content"><div class="card"><b>MP Vinyl</b><div id="profileStatus" class="small" style="margin-top:6px">Nicht angemeldet</div></div><div class="profile-actions"><select id="profileLang"><option value="de">🇩🇪 Deutsch</option><option value="no">🇳🇴 Norsk</option></select><button id="profileLogin">Konto & Synchronisierung</button><button id="exportBtn">Sicherheitskopie speichern</button><button id="importBtn">Sicherheitskopie laden</button></div><input id="importFile" type="file" accept=".json" hidden></div></section>

<nav class="bottom">
<button class="nav active" data-go="home"><span class="nicon">⌂</span><span data-i18n="navHome">Start</span></button>
<button class="nav" data-go="search"><span class="nicon">⌕</span><span data-i18n="navSearch">Suche</span></button>
<button class="nav plus" id="navAdd"><span class="nicon">＋</span></button>
<button class="nav" data-go="stats"><span class="nicon">▥</span><span data-i18n="navStats">Statistik</span></button>
<button class="nav" data-go="profile"><span class="nicon">◯</span><span data-i18n="navProfile">Profil</span></button>
</nav>

<dialog id="loginDialog"><div class="modal"><div class="modal-head"><h3 id="loginTitle">Anmelden</h3><button class="close" data-close="loginDialog">×</button></div><p id="loginSub" class="small"></p><div class="field"><label>E-Mail</label><input id="loginEmail" type="email"></div><div class="field"><label id="passLabel">Passwort</label><input id="loginPassword" type="password"></div><button id="signInBtn" class="primary">Anmelden</button><button id="signUpBtn" class="secondary">Jetzt registrieren</button><button id="signOutBtn" class="secondary" style="display:none">Abmelden</button><div id="loginMsg" class="small" style="margin-top:10px"></div></div></dialog>

<dialog id="addDialog"><div class="modal"><div class="modal-head"><h3 id="addTitle">Neue Platte</h3><button class="close" data-close="addDialog">×</button></div><div class="field"><label id="coverLabel">Coverfoto</label><input id="photoInput" type="file" accept="image/*" capture="environment"></div><div class="field"><label id="artistLabel">Interpret</label><input id="artistInput"></div><div class="field"><label>Album</label><input id="albumInput"></div><div class="row"><div class="field"><label id="yearLabel">Jahr</label><input id="yearInput"></div><div class="field"><label>Genre</label><input id="genreInput"></div></div><div class="field"><label id="tracksLabel">Titel / Songs</label><textarea id="tracksInput" rows="4"></textarea></div><button id="saveRecord" class="primary">Speichern</button></div></dialog>

<script>
const SUPABASE_URL='https://ngbineemnuvrasvffopv.supabase.co';
const SUPABASE_KEY='sb_publishable__qc-ad5QfgcRLzODUeKsIA_mb8mME6h';
const sb=window.supabase?.createClient?window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY):null;
const $=id=>document.getElementById(id);
let lang=localStorage.getItem('mp-vinyl-lang')||'de';
let records=JSON.parse(localStorage.getItem('mp-vinyl-records-v1')||'[]');
let currentUser=null,photoData='';

const T={
de:{tag:'Meine Sammlung. Meine Musik.',login:'Anmelden',account:'Konto',add:'Neue Platte hinzufügen',collection:'Meine Sammlung',recent:'Zuletzt hinzugefügt',collectionTitle:'Sammlung',search:'Suche',stats:'Statistik',profile:'Profil',records:'Platten',artists:'Interpreten',genres:'Genres',years:'Jahrgänge',topArtist:'Meistgesammelter Interpret',topGenre:'Häufigstes Genre',notSigned:'Nicht angemeldet',sync:'Konto & Synchronisierung',export:'Sicherheitskopie speichern',import:'Sicherheitskopie laden',homeSearch:'Künstler, Album, Jahr oder Genre …',searchPlaceholder:'Interpret, Album, Jahr oder Genre …',save:'Speichern',newRecord:'Neue Platte',cover:'Coverfoto',artist:'Interpret',year:'Jahr',tracks:'Titel / Songs',pass:'Passwort',register:'Jetzt registrieren',logout:'Abmelden'},
no:{tag:'Min samling. Min musikk.',login:'Logg inn',account:'Konto',add:'Legg til ny plate',collection:'Min samling',recent:'Sist lagt til',collectionTitle:'Samling',search:'Søk',stats:'Statistikk',profile:'Profil',records:'Plater',artists:'Artister',genres:'Sjangre',years:'Årstall',topArtist:'Mest samlet artist',topGenre:'Vanligste sjanger',notSigned:'Ikke innlogget',sync:'Konto og synkronisering',export:'Lagre sikkerhetskopi',import:'Last inn sikkerhetskopi',homeSearch:'Artist, album, år eller sjanger …',searchPlaceholder:'Artist, album, år eller sjanger …',save:'Lagre',newRecord:'Ny plate',cover:'Coverbilde',artist:'Artist',year:'År',tracks:'Spor / sanger',pass:'Passord',register:'Registrer deg',logout:'Logg ut'}
};
function tr(k){return T[lang][k]}
function applyLang(){
 document.documentElement.lang=lang==='no'?'no':'de';
 $('homeLang').value=lang;$('profileLang').value=lang;$('tagline').textContent=tr('tag');
 $('homeLogin').textContent=currentUser?tr('account'):tr('login');$('addHomeText').textContent=tr('add');$('collectionHomeText').textContent=tr('collection');
 $('recentTitle').textContent=tr('recent');$('collectionTitle').textContent=tr('collectionTitle');$('searchTitle').textContent=tr('search');$('statsTitle').textContent=tr('stats');$('profileTitle').textContent=tr('profile');
 $('lblRecords').textContent=tr('records');$('lblArtists').textContent=tr('artists');$('lblGenres').textContent=tr('genres');$('lblYears').textContent=tr('years');
 $('topArtistLabel').textContent=tr('topArtist');$('topGenreLabel').textContent=tr('topGenre');$('profileStatus').textContent=currentUser?.email||tr('notSigned');
 $('profileLogin').textContent=tr('sync');$('exportBtn').textContent=tr('export');$('importBtn').textContent=tr('import');
 $('homeSearch').placeholder=tr('homeSearch');$('collectionSearch').placeholder=tr('homeSearch');$('searchInput').placeholder=tr('searchPlaceholder');
 document.querySelector('[data-i18n="navHome"]').textContent='Start';document.querySelector('[data-i18n="navSearch"]').textContent=tr('search');document.querySelector('[data-i18n="navStats"]').textContent=tr('stats');document.querySelector('[data-i18n="navProfile"]').textContent=tr('profile');
 $('loginTitle').textContent=tr('login');
 $('loginSub').textContent=lang==='no'?'Logg inn for å synkronisere samlingen på alle enhetene dine.':'Melde dich an, um deine Sammlung auf allen Geräten zu synchronisieren.';$('passLabel').textContent=tr('pass');$('signInBtn').textContent=tr('login');$('signUpBtn').textContent=tr('register');$('signOutBtn').textContent=tr('logout');
 $('addTitle').textContent=tr('newRecord');$('coverLabel').textContent=tr('cover');$('artistLabel').textContent=tr('artist');$('yearLabel').textContent=tr('year');$('tracksLabel').textContent=tr('tracks');$('saveRecord').textContent=tr('save');
}
function setLang(v){lang=v;localStorage.setItem('mp-vinyl-lang',lang);applyLang()}
$('homeLang').onchange=e=>setLang(e.target.value);$('profileLang').onchange=e=>setLang(e.target.value);

function saveLocal(){localStorage.setItem('mp-vinyl-records-v1',JSON.stringify(records))}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function show(name){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));$(name)?.classList.add('active');document.querySelectorAll('.nav').forEach(n=>n.classList.toggle('active',n.dataset.go===name));if(name==='collection')renderCollection('');if(name==='search')renderSearch('');if(name==='stats')renderStats();if(name==='profile')updateProfile();window.scrollTo(0,0)}
document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>show(b.dataset.go));$('openCollection').onclick=()=>show('collection');$('homeSearch').onfocus=()=>show('search');

function recordCard(r){return `<article class="record"><div class="cover">${r.photoData?`<img src="${r.photoData}">`:''}</div><div class="meta"><b>${esc(r.artist||'')}</b><div>${esc(r.album||'')}</div><small>${[r.year,r.genre].filter(Boolean).map(esc).join(' · ')}</small></div></article>`}
function renderCollection(q=''){q=q.toLowerCase().trim();const a=!q?records:records.filter(r=>[r.artist,r.album,r.year,r.genre,r.tracks].some(v=>String(v||'').toLowerCase().includes(q)));$('collectionGrid').innerHTML=a.length?a.map(recordCard).join(''):`<div class="small">${lang==='no'?'Ingen plater ennå.':'Noch keine Platten gespeichert.'}</div>`;renderRecent()}
function renderSearch(q=''){q=q.toLowerCase().trim();const a=!q?records:records.filter(r=>[r.artist,r.album,r.year,r.genre,r.tracks].some(v=>String(v||'').toLowerCase().includes(q)));$('searchGrid').innerHTML=a.length?a.map(recordCard).join(''):`<div class="small">${lang==='no'?'Ingen treff.':'Keine Treffer.'}</div>`}
function renderRecent(){const a=records.slice(0,3);$('recentGrid').innerHTML=a.length?a.map(r=>`<div class="mini"><div class="c">${r.photoData?`<img src="${r.photoData}" style="width:100%;height:100%;object-fit:cover">`:''}</div><div class="m"><b>${esc(r.artist||'')}</b><br>${esc(r.album||'')}</div></div>`).join(''):`<div class="small">${lang==='no'?'Ingen plater ennå.':'Noch keine Platten.'}</div>`}
$('collectionSearch').oninput=e=>renderCollection(e.target.value);$('searchInput').oninput=e=>renderSearch(e.target.value);
function renderStats(){const ar={},ge={},yr=new Set();records.forEach(r=>{if(r.artist)ar[r.artist]=(ar[r.artist]||0)+1;if(r.genre)ge[r.genre]=(ge[r.genre]||0)+1;if(r.year)yr.add(r.year)});const top=o=>Object.entries(o).sort((a,b)=>b[1]-a[1])[0];$('sRecords').textContent=records.length;$('sArtists').textContent=Object.keys(ar).length;$('sGenres').textContent=Object.keys(ge).length;$('sYears').textContent=yr.size;const a=top(ar),g=top(ge);$('topArtist').textContent=a?`${a[0]} · ${a[1]}`:'–';$('topGenre').textContent=g?`${g[0]} · ${g[1]}`:'–'}
function updateProfile(){$('profileStatus').textContent=currentUser?.email||tr('notSigned')}

function openAdd(){$('addDialog').showModal()}$('addFromHome').onclick=openAdd;$('navAdd').onclick=openAdd;
$('photoInput').onchange=e=>{const f=e.target.files?.[0];if(!f)return;const rd=new FileReader();rd.onload=()=>photoData=rd.result;rd.readAsDataURL(f)}
$('saveRecord').onclick=async()=>{const r={id:crypto.randomUUID(),artist:$('artistInput').value.trim(),album:$('albumInput').value.trim(),year:$('yearInput').value.trim(),genre:$('genreInput').value.trim(),tracks:$('tracksInput').value.trim(),photoData};if(!r.artist&&!r.album)return;records.unshift(r);saveLocal();$('addDialog').close();['artistInput','albumInput','yearInput','genreInput','tracksInput'].forEach(id=>$(id).value='');photoData='';renderCollection('');if(currentUser&&sb){
  try{
    const cloudRecord={
      id:r.id,
      user_id:currentUser.id,
      artist:r.artist||'',
      album:r.album||'',
      release_year:r.year?Number(r.year):null,
      genre:r.genre||'',
      tracks:(r.tracks||'').split(/\r?\n/).map(x=>x.trim()).filter(Boolean),
      cover_url:r.coverUrl||null,
      cover_data:r.photoData||null
    };
    const {error}=await sb.from('vinyl_records').upsert(cloudRecord);
    if(error) console.error('Cloud save:',error.message);
  }catch(e){console.error('Cloud save:',e)}
}}
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>$(b.dataset.close).close());

function openLogin(){$('loginDialog').showModal()}$('homeLogin').onclick=openLogin;$('profileLogin').onclick=openLogin;
async function refreshAuth(){if(!sb)return;const {data}=await sb.auth.getSession();currentUser=data.session?.user||null;applyLang()}
$('signInBtn').onclick=async()=>{if(!sb)return;const {data,error}=await sb.auth.signInWithPassword({email:$('loginEmail').value.trim(),password:$('loginPassword').value});if(error)return $('loginMsg').textContent=error.message;currentUser=data.user;applyLang();$('loginMsg').textContent=lang==='no'?'Innlogget.':'Angemeldet.';await syncFromCloud()}
$('signUpBtn').onclick=async()=>{if(!sb)return;const {data,error}=await sb.auth.signUp({email:$('loginEmail').value.trim(),password:$('loginPassword').value});if(error)return $('loginMsg').textContent=error.message;currentUser=data.user;applyLang();$('loginMsg').textContent=data.session?(lang==='no'?'Registrering opprettet og innlogget.':'Registrierung erstellt und angemeldet.'):(lang==='no'?'Registrering opprettet. Sjekk e-posten din hvis bekreftelse kreves.':'Registrierung erstellt. Prüfe deine E-Mail, falls eine Bestätigung erforderlich ist.')}
$('signOutBtn').onclick=async()=>{if(sb)await sb.auth.signOut();currentUser=null;applyLang();$('loginDialog').close()}
async function syncFromCloud(){if(!sb||!currentUser)return;try{const {data,error}=await sb.from('vinyl_records').select('*').eq('user_id',currentUser.id);if(!error&&Array.isArray(data)&&data.length){records=data.map(x=>({
  id:x.id,
  artist:x.artist||'',
  album:x.album||'',
  year:x.release_year?String(x.release_year):'',
  genre:x.genre||'',
  tracks:Array.isArray(x.tracks)?x.tracks.join('\n'):(x.tracks||''),
  coverUrl:x.cover_url||'',
  photoData:x.cover_data||''
}));saveLocal();renderCollection('')}}catch(e){}}
$('exportBtn').onclick=()=>{const blob=new Blob([JSON.stringify(records,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='mp-vinyl-backup.json';a.click();URL.revokeObjectURL(a.href)}
$('importBtn').onclick=()=>$('importFile').click();$('importFile').onchange=async e=>{const f=e.target.files?.[0];if(!f)return;try{const d=JSON.parse(await f.text());if(Array.isArray(d)){records=d;saveLocal();renderCollection('')}}catch(e){}}
applyLang();renderRecent();refreshAuth();
</script>
</body></html>
